name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Allow the workflow to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /fate-city-1999

      # SvelteKit adapter-static requires a .nojekyll file so GitHub Pages
      # serves files that start with an underscore (e.g. _app/).
      - name: Add .nojekyll
        run: touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # A separate job (rather than a step in `build`) so this runs on a
      # fresh runner moments later — deploy-pages queries the Actions API
      # for the artifact by workflow-run ID, and doing that immediately
      # after the upload in the same job is prone to "Found 0 artifact(s)"
      # from API propagation lag.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
